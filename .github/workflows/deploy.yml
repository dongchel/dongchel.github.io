name: deploy

# The site is plain static files — no build step. This copies exactly the
# files the site uses into _site and publishes them to the gh-pages branch.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir _site
          cp index.html publications.html research.html 404.html robots.txt sitemap.xml _site/
          mkdir -p _site/assets/img _site/assets/pdf
          cp -r assets/css assets/js _site/assets/
          cp assets/img/*.webp assets/img/*.jpg _site/assets/img/
          cp -r assets/img/publication_preview _site/assets/img/
          cp -r assets/img/research _site/assets/img/
          cp assets/pdf/*.pdf _site/assets/pdf/
          touch _site/.nojekyll

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
